[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actions-safecheck"
version = "0.1.0"
description = "Read-only GitHub Actions workflow safety linter"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Varun Ruhella" }]
license = { file = "LICENSE" }
keywords = ["github-actions", "security", "ci", "devsecops", "workflow-linter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
actions-safecheck = "actions_safecheck.linter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
